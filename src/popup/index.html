<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小红书采集助手</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="popup">
    <!-- 核心区 -->
    <header class="head">
      <div class="head-title">
        <h1>小红书采集助手</h1>
        <p class="sub">关键词一键采集笔记与评论</p>
      </div>
      <button id="openTabBtn" class="btn-tab" title="在新标签页中打开（防止点击外部失焦关闭）">⤢ 独立窗口</button>
    </header>

    <section class="core">
      <label class="field">
        <span>采集关键词（支持逗号或换行批量输入）</span>
        <input id="keyword" type="text" placeholder="如：护肤, 穿搭, 探店（多词自动连续采）" autofocus />
      </label>

      <div class="field-grid-2">
        <label class="field">
          <span>采集数量</span>
          <select id="limit">
            <option value="10">10 篇</option>
            <option value="20" selected>20 篇</option>
            <option value="50">50 篇</option>
            <option value="100">100 篇</option>
          </select>
        </label>
        <label class="field">
          <span>评论采集深度</span>
          <select id="commentsDepth">
            <option value="0">不采评论（极速）</option>
            <option value="20" selected>20条热评</option>
            <option value="50">50条深采</option>
          </select>
        </label>
      </div>

      <div class="btn-group-main">
        <button id="startBtn" class="btn btn-primary">开始一键采集</button>
        <button id="cancelBtn" class="btn btn-ghost" disabled>取消</button>
      </div>
      <button id="finishEarlyBtn" class="btn btn-warning" style="display:none;width:100%;margin-top:6px;">就采这些，结束采集</button>
      <button id="newBtn" class="btn btn-secondary-ghost" style="display:none">新建采集 / 清空当前</button>
    </section>

    <!-- 进度区 -->
    <section class="progress">
      <div class="bar-track">
        <div id="progressBar" class="bar-fill" style="width:0%"></div>
      </div>
      <div class="progress-meta">
        <span id="progressText">0%</span>
        <span id="statusText" class="status">待命</span>
      </div>
      <div id="stepDetail" class="step-detail" style="display:none"></div>
      <div id="errorBox" class="error" style="display:none"></div>
    </section>

    <!-- 预览与导出卡片 -->
    <section id="previewSection" class="preview-card" style="display:none">
      <div class="preview-header">
        <span class="preview-title">最近采集预览 (<span id="previewCount">0</span> 篇)</span>
      </div>
      <div id="previewList" class="preview-list"></div>
    </section>

    <!-- 导出区 -->
    <section class="export">
      <button id="exportCsvBtn" class="btn btn-outline" disabled>导出笔记 CSV</button>
      <button id="exportCommentsBtn" class="btn btn-outline" disabled>导出评论 CSV</button>
      <button id="exportJsonBtn" class="btn btn-outline" disabled>导出 JSON</button>
    </section>

    <!-- 高级抽屉（折叠） -->
    <section class="advanced">
      <button id="advancedToggle" class="adv-toggle" aria-expanded="false">
        <span>高级设置 (API 与延迟)</span>
        <span class="chevron">▸</span>
      </button>
      <div id="advancedPanel" class="adv-panel">
        <label class="field">
          <span>接口协议类型</span>
          <select id="protocol">
            <option value="auto">自动识别 (根据地址/模型)</option>
            <option value="openai">OpenAI 兼容 (ChatGPT / DeepSeek / 中转站)</option>
            <option value="anthropic">Anthropic (Claude 原生)</option>
          </select>
        </label>

        <label class="field">
          <span>API 接口地址</span>
          <input id="apiBase" type="text" placeholder="留空默认官方；或填写如 https://api.openai.com" />
        </label>

        <label class="field">
          <span>模型名称</span>
          <input id="model" type="text" placeholder="claude-3-5-sonnet-latest / gpt-4o / deepseek-chat" />
        </label>

        <label class="field">
          <span>API Key</span>
          <input id="apiKey" type="password" placeholder="sk-... 或 sk-ant-..." />
        </label>

        <div class="test-row">
          <button id="testLlmBtn" class="btn btn-small">测试 API 连接</button>
          <span id="testFeedback" class="test-feedback"></span>
        </div>

        <label class="field field-row">
          <span>采集评论</span>
          <input id="comments" type="checkbox" />
        </label>

        <label class="field">
          <span>爬取延迟</span>
          <select id="delay">
            <option value="0">无延迟（随机2~5秒防封）</option>
            <option value="500">固定 0.5 秒</option>
            <option value="1000">固定 1 秒</option>
            <option value="2000">固定 2 秒</option>
          </select>
        </label>

        <div class="config-status-row">
          <span id="saveHint" class="save-hint"></span>
          <button id="resetBtn" class="btn btn-ghost danger btn-small">清空本地配置</button>
        </div>
      </div>
    </section>
  </main>

  <script src="popup.js"></script>
</body>
</html>
